<style>
:root {
  --cream:#fbf7ee;
  --cream2:#f5eddf;
  --sage:#667a5f;
  --sage2:#9caf91;
  --sage3:#dce6d6;
  --gold:#c99b3b;
  --gold2:#e9c977;
  --blue:#b8d1df;
  --ink:#4f654a;
  --line:rgba(102,122,95,.28);
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; background:var(--cream); }
body {
  font-family:Tahoma, Arial, sans-serif;
  color:var(--ink);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.page {
  position:relative;
  width:100%;
  min-height:100svh;
  background:
    radial-gradient(circle at 10% 30%, rgba(220,230,214,.48), transparent 19%),
    radial-gradient(circle at 92% 50%, rgba(234,214,173,.22), transparent 20%),
    linear-gradient(180deg,#fffaf1 0%,#fbf7ee 58%,#f7f1e5 100%);
  overflow:hidden;
}
.content {
  position:relative;
  z-index:3;
  width:100%;
  max-width:680px;
  margin:0 auto;
}

/* HERO */
.hero {
  position:relative;
  width:100%;
  height:min(62svh, 720px);
  min-height:470px;
  overflow:hidden;
  background:#fbf7ee;
}
.hero-photo {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 14%;
  animation:heroIn 1.15s cubic-bezier(.2,.65,.25,1) both;
}
.hero-fade {
  position:absolute;
  inset:auto 0 0;
  height:26%;
  background:linear-gradient(to bottom,rgba(251,247,238,0),#fbf7ee 76%);
  z-index:2;
}

/* Big moving balloons */
.balloon {
  position:absolute;
  z-index:5;
  width:clamp(58px,13vw,92px);
  aspect-ratio:.72;
  border-radius:52% 48% 50% 50%;
  opacity:.88;
  box-shadow:inset -12px -12px 24px rgba(60,70,55,.07), inset 12px 12px 18px rgba(255,255,255,.42);
  transform-origin:50% 120%;
}
.balloon::after {
  content:"";
  position:absolute;
  left:50%;
  top:98%;
  width:1.4px;
  height:115px;
  background:linear-gradient(var(--gold), transparent);
}
.b1 { right:4%; top:13%; background:#b9cba9; animation:balloonA 3.6s ease-in-out infinite; }
.b2 { right:-2%; top:19%; background:#b6d2e0; animation:balloonB 4.2s ease-in-out infinite -.8s; }
.b3 { right:10%; top:25%; background:#ecd9b2; animation:balloonC 4.7s ease-in-out infinite -1.8s; }

/* Moving bunting */
.bunting {
  position:absolute;
  z-index:5;
  top:4.5%;
  right:20%;
  width:48%;
  height:90px;
  transform-origin:50% 0;
  animation:buntingMove 3.2s ease-in-out infinite;
}
.bunting::before {
  content:"";
  position:absolute;
  top:5px; left:0; right:0;
  height:2px; border-radius:2px;
  background:rgba(169,139,80,.66);
}
.flag {
  position:absolute;
  top:6px;
  width:23%;
  height:62%;
  clip-path:polygon(0 0,100% 0,50% 100%);
  opacity:.85;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.06));
}
.f1{right:0;background:#dec896}
.f2{right:25%;background:#aebda3}
.f3{right:50%;background:#a9c7d8}
.f4{right:75%;background:#e1c78f}

/* Leaves that visibly sway */
.branch {
  position:absolute;
  z-index:5;
  width:130px;
  height:150px;
  opacity:.72;
  transform-origin:10% 90%;
}
.branch.left-top { left:-25px; top:3%; animation:swayL 3.9s ease-in-out infinite; }
.branch.left-mid { left:-38px; top:58%; animation:swayL 4.8s ease-in-out infinite -1.1s; }
.branch.right-mid { right:-35px; top:58%; animation:swayR 4.3s ease-in-out infinite -.6s; }
.stem {
  position:absolute; left:55%; top:4%; bottom:4%; width:2px;
  background:#9cae90; transform:rotate(22deg); border-radius:2px;
}
.leaf {
  position:absolute; width:40px; height:22px;
  border-radius:70% 20% 70% 20%; background:#a9ba9e;
  box-shadow:inset 0 0 8px rgba(255,255,255,.2);
}
.l1{left:32px;top:18px;transform:rotate(-28deg)}
.l2{left:68px;top:42px;transform:rotate(22deg)}
.l3{left:18px;top:70px;transform:rotate(-18deg)}
.l4{left:72px;top:94px;transform:rotate(30deg)}
.l5{left:35px;top:115px;transform:rotate(-24deg)}

/* Sparkles and falling petals */
.fx {position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.spark {
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,var(--gold2) 0 34%,rgba(201,155,59,.15) 35% 100%);
  animation:twinkle 3.2s ease-in-out infinite;
}
.s1{left:12%;top:14%;animation-delay:-.5s}
.s2{left:84%;top:11%;animation-delay:-1.9s}
.s3{left:21%;top:36%;animation-delay:-2.6s}
.s4{left:79%;top:44%;animation-delay:-1.2s}
.s5{left:14%;top:72%;animation-delay:-2.2s}
.s6{left:87%;top:76%;animation-delay:-.8s}
.petal {
  position:absolute; top:-12%;
  width:16px;height:10px;border-radius:70% 20% 70% 20%;
  background:#b1c0a5;opacity:.58;
  animation:fall linear infinite;
}
.p1{left:8%;animation-duration:8.8s;animation-delay:-2s}
.p2{left:25%;animation-duration:10.2s;animation-delay:-6s}
.p3{left:47%;animation-duration:9.4s;animation-delay:-4s}
.p4{left:68%;animation-duration:11.2s;animation-delay:-7.5s}
.p5{left:89%;animation-duration:9.9s;animation-delay:-3.5s}

/* TEXT */
.main {
  position:relative;
  z-index:7;
  margin-top:-44px;
  padding:0 18px 28px;
}
.name {
  margin:0;
  text-align:center;
  font-size:clamp(68px,19vw,126px);
  line-height:.9;
  font-weight:900;
  letter-spacing:-5px;
  color:#5d7456;
  text-shadow:0 4px 0 rgba(255,255,255,.7);
  animation:rise .85s .15s both;
}
.tagline {
  margin:24px auto 25px;
  max-width:560px;
  text-align:center;
  font-size:clamp(17px,4.2vw,28px);
  line-height:1.9;
  font-weight:700;
  animation:rise .85s .3s both;
}
.ornament {
  width:76px;height:1px;background:var(--gold);margin:0 auto 26px;position:relative;
}
.ornament::after {
  content:"♡"; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-54%); background:var(--cream);
  color:var(--gold); padding:0 11px; font-size:26px;
}

/* cards */
.card {
  width:100%;
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(255,255,255,.58);
  box-shadow:0 10px 24px rgba(78,96,72,.09);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  animation:rise .8s both;
}
.schedule {padding:16px 20px;margin-bottom:22px;animation-delay:.42s}
.row {
  display:flex;align-items:center;justify-content:center;gap:14px;
  min-height:58px;font-size:clamp(18px,4.4vw,27px);font-weight:700;text-align:center;
}
.row + .row {border-top:1px solid rgba(102,122,95,.13)}
.ico {
  flex:0 0 42px;width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;color:#ae7e1d;font-size:27px;
  background:rgba(237,216,166,.26);
}
.section-title {
  text-align:center;margin:3px 0 13px;
  font-size:clamp(17px,4.2vw,25px);font-weight:700;color:#788b72;
}
.venue {
  display:grid;grid-template-columns:1fr 92px;align-items:center;
  gap:14px;padding:19px 18px;margin-bottom:18px;animation-delay:.55s;
}
.venue-name {font-size:clamp(22px,5.5vw,34px);font-weight:900;margin-bottom:8px}
.address {font-size:clamp(15px,3.7vw,22px);line-height:1.9;font-weight:600}
.house {
  width:88px;height:82px;position:relative;justify-self:center;
}
.house .roof {
  position:absolute;left:6px;right:6px;top:8px;height:36px;
  background:#e6edde;border:2px solid #8ca080;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.house .body {
  position:absolute;left:16px;right:16px;bottom:5px;height:44px;
  background:#f4f7ef;border:2px solid #8ca080;border-radius:3px;
}
.house .door {
  position:absolute;width:15px;height:24px;left:37px;bottom:5px;
  border:2px solid #8ca080;background:#d9e5d0;
}
.house .sun {
  position:absolute;right:-3px;top:-2px;font-size:26px;color:#c99b3b;
}

/* Buttons */
.buttons {
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  animation:rise .8s .7s both;
}
.mapbtn {
  min-height:82px;border-radius:24px;
  text-decoration:none;color:#465c42;
  background:rgba(255,255,255,.72);
  border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(78,96,72,.10);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:clamp(16px,4vw,23px);font-weight:800;
  transition:transform .18s ease,box-shadow .18s ease;
}
.mapbtn:active {transform:scale(.97);box-shadow:0 4px 10px rgba(78,96,72,.08)}
.pin {
  width:34px;height:34px;position:relative;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);background:linear-gradient(135deg,#70a85f,#3f7250);
}
.pin::after {
  content:"";position:absolute;inset:9px;border-radius:50%;background:#fff;
}
.neshan-mark {
  width:34px;height:34px;border-radius:50%;
  border:7px solid #38a9a3;box-shadow:inset 0 0 0 4px #e9f5f3;
}
.footer {
  margin:18px auto 2px;
  width:max-content;max-width:100%;
  padding:10px 20px;border-radius:999px;
  background:rgba(222,223,191,.55);
  font-weight:700;font-size:clamp(15px,3.8vw,20px);
  animation:rise .8s .82s both;
}

/* slightly more motion in the whole top art */
@keyframes heroIn {
  from{opacity:0;transform:scale(1.06) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes balloonA {
  0%,100%{transform:translate(0,0) rotate(-4deg)}
  50%{transform:translate(-18px,-24px) rotate(7deg)}
}
@keyframes balloonB {
  0%,100%{transform:translate(0,0) rotate(4deg)}
  50%{transform:translate(14px,-30px) rotate(-8deg)}
}
@keyframes balloonC {
  0%,100%{transform:translate(0,0) rotate(2deg)}
  50%{transform:translate(-12px,-20px) rotate(8deg)}
}
@keyframes buntingMove {
  0%,100%{transform:rotate(-1.4deg) translateY(0)}
  50%{transform:rotate(2deg) translateY(7px)}
}
@keyframes swayL {
  0%,100%{transform:rotate(-8deg) translateY(0)}
  50%{transform:rotate(10deg) translateY(-12px)}
}
@keyframes swayR {
  0%,100%{transform:rotate(8deg) translateY(0)}
  50%{transform:rotate(-10deg) translateY(12px)}
}
@keyframes twinkle {
  0%,100%{transform:scale(.65);opacity:.2}
  50%{transform:translateY(-16px) scale(1.55);opacity:.95}
}
@keyframes fall {
  0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:0}
  8%{opacity:.58}
  100%{transform:translate3d(80px,118svh,0) rotate(330deg);opacity:0}
}
@keyframes rise {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@media (max-width:420px) {
  .hero{height:56svh;min-height:420px}
  .main{padding-left:14px;padding-right:14px}
  .venue{grid-template-columns:1fr 74px}
  .house{transform:scale(.84)}
  .buttons{gap:9px}
  .mapbtn{min-height:72px}
}
@media (min-width:681px) {
  .page{padding:24px 0}
  .content{border-radius:34px;overflow:hidden;box-shadow:0 24px 70px rgba(70,82,65,.16)}
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
